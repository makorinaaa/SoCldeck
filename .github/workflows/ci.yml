name: SocialDeck CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: unit-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check for committed secrets
        run: npm.cmd run security:check

      - name: Lint
        run: npm.cmd run lint

      - name: Run unit tests
        run: npm.cmd test

  electron-e2e:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Electron E2E tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force test-results | Out-Null
          & npm.cmd run test:e2e 2>&1 | Tee-Object -FilePath test-results/e2e.log
          exit $LASTEXITCODE

      - name: Run local security tests
        run: npm.cmd run test:security

      - name: Upload E2E log
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: electron-e2e-log
          path: test-results/
          retention-days: 7
