name: Release SocialDeck

on:
  push:
    tags:
      - "v*"

# The build job installs and runs third-party packages, so it only gets read access.
# Only the publish job, which runs no project dependencies, can write the release.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Validate release tag
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./package.json').version"
          $tagVersion = "${{ github.ref_name }}" -replace '^v', ''
          if ($tagVersion -ne $packageVersion) {
            Write-Error "Tag version $tagVersion does not match package version $packageVersion"
            exit 1
          }
          "## SocialDeck v$packageVersion release" >> $env:GITHUB_STEP_SUMMARY
          "Tag and package versions match." >> $env:GITHUB_STEP_SUMMARY

      - name: Install dependencies
        run: npm ci

      - name: Check for committed secrets
        run: npm.cmd run security:check

      - name: Run unit tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force test-results | Out-Null
          & npm.cmd test 2>&1 | Tee-Object -FilePath test-results/unit-tests.log
          $testExitCode = $LASTEXITCODE
          if ($testExitCode -ne 0) { exit $testExitCode }

      - name: Run Electron E2E tests
        shell: pwsh
        run: |
          $maxAttempts = 2
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            $logPath = "test-results/e2e-attempt-$attempt.log"
            & npm.cmd run test:e2e 2>&1 | Tee-Object -FilePath $logPath
            $testExitCode = $LASTEXITCODE
            if ($testExitCode -eq 0) {
              if ($attempt -gt 1) {
                Write-Output "::warning title=E2E retry::Electron E2E passed on attempt $attempt. Review the first-attempt log artifact."
              }
              break
            }
            if ($attempt -lt $maxAttempts) {
              Write-Output "::warning title=E2E retry::Electron E2E failed on attempt $attempt and will retry once."
              Start-Sleep -Seconds 5
            }
          }
          if ($testExitCode -ne 0) {
            "### Electron E2E failure" >> $env:GITHUB_STEP_SUMMARY
            "Attempt $attempt failed. The final log lines are included below." >> $env:GITHUB_STEP_SUMMARY
            '```text' >> $env:GITHUB_STEP_SUMMARY
            Get-Content -LiteralPath $logPath -Tail 80 >> $env:GITHUB_STEP_SUMMARY
            '```' >> $env:GITHUB_STEP_SUMMARY
            exit $testExitCode
          }

      - name: Run local security tests
        run: npm.cmd run test:security

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: test-results-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Build Windows release
        run: npm run build-win

      - name: Verify release artifacts
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./package.json').version"
          $expectedArtifacts = @(
            "dist/SocialDeck-$packageVersion-x64.exe",
            "dist/SocialDeck-$packageVersion-x64.exe.blockmap",
            "dist/latest.yml"
          )
          $missingArtifacts = $expectedArtifacts | Where-Object {
            -not (Test-Path -LiteralPath $_ -PathType Leaf)
          }
          if ($missingArtifacts) {
            Write-Error "Missing release artifacts: $($missingArtifacts -join ', ')"
            exit 1
          }
          Get-Item $expectedArtifacts | Select-Object Name, Length

      - name: Upload release artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-artifacts
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          if-no-files-found: error
          retention-days: 1

  publish-release:
    needs: build-windows
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download release artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: release-artifacts
          path: dist

      - name: Generate release notes
        shell: pwsh
        run: |
          $currentTag = "${{ github.ref_name }}"
          $previousTag = git describe --tags --abbrev=0 "$currentTag^" 2>$null
          if ($LASTEXITCODE -eq 0 -and $previousTag) {
            $range = "$previousTag..$currentTag"
          } else {
            $range = $currentTag
          }
          $subjects = @(git log $range --pretty=format:"%s")
          if ($subjects.Count -eq 0) {
            $subjects = @("Maintenance update")
          }
          $notes = @("# What's Changed", "") + @($subjects | ForEach-Object { "- $_" })
          $notes | Set-Content -LiteralPath release-notes.md -Encoding utf8

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          fail_on_unmatched_files: true
          body_path: release-notes.md
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
